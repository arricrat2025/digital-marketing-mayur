<style>
/* ============================================================
   NEATWEAR DESIGN SYSTEM
   ============================================================ */
:root{
  --navy:#0B1F33;
  --navy-800:#122b45;
  --blue:#1261A0;
  --blue-600:#0f5288;
  --teal:#16A6A0;
  --teal-600:#118e89;
  /* Brand accent taken from the live NeatWear identity.
     To revert to the teal-led scheme, set --accent to var(--teal). */
  --accent:#D0402F;
  --accent-600:#B23425;
  --accent-soft:#FBEDEB;
  --green:#45B97C;
  --bg:#F5F8FA;
  --white:#FFFFFF;
  --ink:#17212B;
  --muted:#667085;
  --line:#E4EBF1;
  --line-soft:#EEF3F7;

  --radius-sm:12px;
  --radius:16px;
  --radius-lg:20px;

  --shadow-sm:0 1px 2px rgba(11,31,51,.05), 0 2px 8px rgba(11,31,51,.04);
  --shadow:0 4px 14px rgba(11,31,51,.07), 0 1px 3px rgba(11,31,51,.05);
  --shadow-lg:0 18px 40px rgba(11,31,51,.12);

  --nav-h:74px;
  --maxw:1200px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:'Manrope','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px;
  line-height:1.65;
  color:var(--ink);
  background:var(--white);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}

h1,h2,h3,h4{color:var(--navy);margin:0 0 .5em;line-height:1.14;letter-spacing:-.02em;font-weight:800}
h1{font-size:clamp(36px,5.2vw,62px);letter-spacing:-.03em}
h2{font-size:clamp(30px,3.6vw,46px)}
h3{font-size:clamp(21px,2vw,27px);font-weight:700;letter-spacing:-.015em}
h4{font-size:19px;font-weight:700}
p{margin:0 0 1.1em}
.lead{font-size:clamp(17px,1.35vw,19px);color:var(--muted);line-height:1.7;max-width:62ch}
.muted{color:var(--muted)}

/* Accessibility ------------------------------------------------ */
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;padding:12px 18px;z-index:999;border-radius:0 0 8px 0}
.skip:focus{left:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Layout ------------------------------------------------------- */
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}
.section{padding:clamp(64px,7vw,104px) 0}
.section--tight{padding:clamp(48px,5vw,72px) 0}
.section--alt{background:var(--bg)}
.section--navy{background:var(--navy);color:#C9D8E4}
.section--navy h2,.section--navy h3,.section--navy h4{color:#fff}
.section--navy p{color:#A9BFD1}

.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:14px;
}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--accent);border-radius:2px}
.section--navy .eyebrow{color:#F0705F}
.section--navy .eyebrow::before{background:#F0705F}

.head{max-width:760px;margin-bottom:clamp(34px,4vw,54px)}
.head--center{margin-left:auto;margin-right:auto;text-align:center}
.head--center .eyebrow{justify-content:center}

.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,72px);align-items:center}

/* Buttons ------------------------------------------------------ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 26px;border-radius:12px;font-weight:700;font-size:15.5px;
  letter-spacing:-.01em;border:1px solid transparent;cursor:pointer;
  transition:transform .25s var(--ease), box-shadow .25s var(--ease), background .2s, color .2s, border-color .2s;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(18,97,160,.24)}
.btn-primary:hover{background:var(--blue-600);box-shadow:0 10px 26px rgba(18,97,160,.32)}
.btn-teal{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(208,64,47,.28)}
.btn-teal:hover{background:var(--accent-600);color:#fff;box-shadow:0 10px 28px rgba(208,64,47,.4)}
.btn-ghost{background:transparent;color:var(--navy);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);background:#fff}
.btn-onDark{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.22);backdrop-filter:blur(8px)}
.btn-onDark:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4)}
.btn-lg{padding:16px 32px;font-size:16.5px}
.btn .ar{transition:transform .25s var(--ease)}
.btn:hover .ar{transform:translateX(3px)}
.btnrow{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}

/* Navbar ------------------------------------------------------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav-h);
  display:flex;align-items:center;
  transition:background .35s var(--ease), box-shadow .35s var(--ease), border-color .35s;
  border-bottom:1px solid transparent;
}
.nav.is-solid{background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom-color:var(--line);box-shadow:0 2px 18px rgba(11,31,51,.06)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand-mark{
  width:40px;height:40px;border-radius:8px;flex:none;
  background:var(--accent);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;letter-spacing:-.04em;
  box-shadow:0 4px 12px rgba(208,64,47,.3);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.05}
.brand-name{font-weight:800;font-size:19.5px;letter-spacing:-.01em;color:#fff;transition:color .3s}
.brand-sub{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.66);transition:color .3s}
.nav.is-solid .brand-name{color:var(--navy)}
.nav.is-solid .brand-sub{color:var(--muted)}

.navlinks{display:flex;align-items:center;gap:4px;list-style:none;margin:0;padding:0}
.navlinks a{
  padding:9px 13px;border-radius:9px;font-size:14.7px;font-weight:600;color:rgba(255,255,255,.86);
  transition:color .2s,background .2s;
}
.navlinks a:hover{color:#fff;background:rgba(255,255,255,.1)}
.navlinks a.active{color:#fff;background:rgba(255,255,255,.14)}
.nav.is-solid .navlinks a{color:#3d5165}
.nav.is-solid .navlinks a:hover{color:var(--blue);background:var(--bg)}
.nav.is-solid .navlinks a.active{color:var(--blue);background:#E8F1F8}
.nav-cta{display:flex;align-items:center;gap:10px}
.burger{
  display:none;width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);cursor:pointer;padding:0;place-items:center;
}
.nav.is-solid .burger{border-color:var(--line);background:#fff}
.burger span{display:block;width:19px;height:2px;background:#fff;border-radius:2px;position:relative;transition:.3s var(--ease)}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:19px;height:2px;background:#fff;border-radius:2px;transition:.3s var(--ease)}
.burger span::before{top:-6px}.burger span::after{top:6px}
.nav.is-solid .burger span,.nav.is-solid .burger span::before,.nav.is-solid .burger span::after{background:var(--navy)}
.burger.open span{background:transparent}
.burger.open span::before{top:0;transform:rotate(45deg)}
.burger.open span::after{top:0;transform:rotate(-45deg)}

.drawer{
  position:fixed;inset:var(--nav-h) 0 0;background:var(--white);z-index:190;
  transform:translateY(-8px);opacity:0;pointer-events:none;transition:.28s var(--ease);
  overflow-y:auto;padding:24px 0 48px;
}
.drawer.open{transform:none;opacity:1;pointer-events:auto}
.drawer ul{list-style:none;margin:0 0 22px;padding:0}
.drawer a{display:block;padding:15px 4px;font-size:18px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--line-soft)}
.drawer a.active{color:var(--blue)}

/* Hero --------------------------------------------------------- */
.hero{position:relative;min-height:clamp(600px,92vh,880px);display:flex;align-items:center;background:var(--navy);overflow:hidden;padding:calc(var(--nav-h) + 40px) 0 60px}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-fallback{position:absolute;inset:0;display:none;background:
  radial-gradient(ellipse 70% 55% at 78% 34%, rgba(22,166,160,.3), transparent 62%),
  radial-gradient(ellipse 60% 50% at 18% 78%, rgba(18,97,160,.36), transparent 62%),
  linear-gradient(165deg,#0B1F33,#0d2a44 55%,#0B1F33);
}
.hero-veil{position:absolute;inset:0;background:linear-gradient(100deg,rgba(11,31,51,.94) 0%,rgba(11,31,51,.82) 38%,rgba(11,31,51,.35) 66%,rgba(11,31,51,.55) 100%);pointer-events:none}
.hero .wrap{position:relative;z-index:3}
.hero-inner{max-width:660px}
.hero h1{color:#fff;margin-bottom:22px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:#B4C8D8;font-size:clamp(16.5px,1.35vw,19px);max-width:54ch;line-height:1.7}
.badge{
  display:inline-flex;align-items:center;gap:12px;padding:9px 16px;border-radius:99px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);
  font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#CFE1EE;margin-bottom:26px;
}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(208,64,47,.22);animation:pulse 2.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(208,64,47,0)}}
.hero-scroll{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:600;
}
.hero-scroll .bar{width:1px;height:34px;background:linear-gradient(rgba(255,255,255,.05),var(--accent))}
.hero-stage{
  position:absolute;right:32px;bottom:32px;z-index:3;display:flex;gap:7px;align-items:center;
  font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);
}
.hero-stage b{color:#F0705F;font-weight:700}

/* Inner page hero ---------------------------------------------- */
.phero{
  position:relative;background:var(--navy);color:#fff;overflow:hidden;
  padding:calc(var(--nav-h) + clamp(56px,6vw,86px)) 0 clamp(50px,6vw,80px);
}
.phero::before{
  content:"";position:absolute;inset:0;opacity:.5;
  background:
    radial-gradient(ellipse 46% 70% at 88% 12%, rgba(22,166,160,.3), transparent 60%),
    radial-gradient(ellipse 44% 60% at 6% 100%, rgba(18,97,160,.42), transparent 62%);
}
.phero::after{
  content:"";position:absolute;inset:0;opacity:.14;
  background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 60% 80% at 70% 30%,#000,transparent 72%);
  mask-image:radial-gradient(ellipse 60% 80% at 70% 30%,#000,transparent 72%);
}
.phero .wrap{position:relative;z-index:2}
.phero h1{color:#fff;max-width:16ch}
.phero p{color:#A9C1D4;max-width:60ch;font-size:clamp(16.5px,1.3vw,18.5px);margin-bottom:0}
.crumb{display:flex;gap:9px;align-items:center;font-size:13px;color:#7E9BB3;margin-bottom:20px;font-weight:600}
.crumb a{color:#7E9BB3}
.crumb a:hover{color:var(--teal)}

/* Cards -------------------------------------------------------- */
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:28px;box-shadow:var(--shadow-sm);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s;
  position:relative;
}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:#CFE0EC}
.card h3{margin-bottom:10px}
.card p{color:var(--muted);font-size:15.6px;margin-bottom:0;line-height:1.65}
a.card{display:block;color:inherit}
.card-link{display:inline-flex;align-items:center;gap:7px;margin-top:16px;font-size:14.5px;font-weight:700;color:var(--blue)}
.card:hover .card-link .ar{transform:translateX(4px)}
.card-link .ar{transition:transform .25s var(--ease)}
.ico{
  width:48px;height:48px;border-radius:13px;display:grid;place-items:center;margin-bottom:18px;
  background:#EAF3FA;color:var(--blue);flex:none;
  transition:background .3s,color .3s;
}
.card:hover .ico{background:var(--blue);color:#fff}
.ico svg{width:23px;height:23px;stroke-width:1.7}
.ico--teal{background:#E2F6F5;color:var(--teal-600)}
.card:hover .ico--teal{background:var(--teal);color:#fff}

.tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;box-shadow:var(--shadow-sm)}
.tile h4{margin-bottom:8px}
.tile p{color:var(--muted);font-size:15.3px;margin:0}

/* Pillar / numbered list --------------------------------------- */
.pillar{display:flex;gap:18px;padding:24px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.pillar:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.pillar .n{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.06em;flex:none;padding-top:3px;min-width:26px}
.pillar h4{margin-bottom:6px}
.pillar p{margin:0;color:var(--muted);font-size:15.3px}

/* Checklist ---------------------------------------------------- */
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start;font-size:16px;color:#33465a}
.checks svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--teal)}
.checks--2{grid-template-columns:repeat(2,1fr)}
.section--navy .checks li{color:#B9CDDC}

/* Process timeline --------------------------------------------- */
.flow{position:relative;display:grid;gap:0}
.flow::before{content:"";position:absolute;left:27px;top:14px;bottom:14px;width:2px;background:var(--line)}
.flow-fill{position:absolute;left:27px;top:14px;width:2px;background:linear-gradient(var(--blue),var(--teal));height:0;transition:height .6s var(--ease)}
.step{position:relative;display:grid;grid-template-columns:56px 1fr;gap:20px;padding:15px 0;align-items:start}
.step .dot{
  width:56px;height:56px;border-radius:15px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted);z-index:2;
  transition:.4s var(--ease);box-shadow:var(--shadow-sm);
}
.step.on .dot{background:var(--navy);border-color:var(--navy);color:#fff;transform:scale(1.04)}
.step h4{margin-bottom:4px;transition:color .3s}
.step p{margin:0;color:var(--muted);font-size:15.4px;max-width:60ch}
.step .stepnum{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--accent);display:block;margin-bottom:3px}

/* Horizontal chip flow ----------------------------------------- */
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0;margin:0;list-style:none}
.chip{
  display:inline-flex;align-items:center;gap:9px;padding:11px 17px;border-radius:11px;
  background:#fff;border:1px solid var(--line);font-weight:700;font-size:14.5px;color:var(--navy);
  box-shadow:var(--shadow-sm);transition:.25s var(--ease);
}
.chip:hover{border-color:var(--teal);color:var(--teal-600);transform:translateY(-3px)}
.chip b{font-size:11.5px;color:var(--teal);font-weight:800;letter-spacing:.08em}
.chip-arrow{color:#B9C7D3;flex:none}
.section--navy .chip{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14);color:#fff}
.section--navy .chip:hover{background:rgba(22,166,160,.16);border-color:var(--teal);color:#fff}

/* Media placeholder blocks ------------------------------------- */
.ph{
  position:relative;border-radius:var(--radius);overflow:hidden;background:
    linear-gradient(150deg,#12314e,#0B1F33 60%);
  border:1px solid rgba(255,255,255,.08);min-height:230px;display:flex;align-items:flex-end;
}
.ph::before{
  content:"";position:absolute;inset:0;opacity:.28;
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.14) 0 1px,transparent 1px 22px);
}
.ph::after{
  content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-90px;
  background:radial-gradient(circle,rgba(22,166,160,.45),transparent 68%);
}
.ph-label{position:relative;z-index:2;padding:20px 22px;width:100%}
.ph-label b{display:block;color:#fff;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.ph-label span{font-size:12px;color:rgba(255,255,255,.55);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ph--tall{min-height:400px}
.ph--wide{min-height:320px}
.ph--light{background:linear-gradient(150deg,#dceaf4,#eef4f9);border-color:var(--line)}
.ph--light::before{background-image:repeating-linear-gradient(115deg,rgba(18,97,160,.09) 0 1px,transparent 1px 22px)}
.ph--light::after{background:radial-gradient(circle,rgba(22,166,160,.22),transparent 68%)}
.ph--light .ph-label b{color:var(--navy)}
.ph--light .ph-label span{color:var(--muted)}

/* Gallery ------------------------------------------------------ */
.gal-filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:30px}
.gal-filters button{
  padding:9px 17px;border-radius:99px;border:1px solid var(--line);background:#fff;
  font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:.2s;
}
.gal-filters button:hover{border-color:var(--blue);color:var(--blue)}
.gal-filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.masonry{columns:3;column-gap:18px}
.masonry .ph{margin-bottom:18px;break-inside:avoid;cursor:pointer;transition:transform .35s var(--ease)}
.masonry .ph:hover{transform:scale(.985)}
.masonry .ph.h1x{min-height:210px}
.masonry .ph.h2x{min-height:310px}
.masonry .ph.h3x{min-height:400px}

.lightbox{position:fixed;inset:0;z-index:400;background:rgba(6,17,29,.93);backdrop-filter:blur(6px);display:none;place-items:center;padding:28px}
.lightbox.open{display:grid}
.lightbox .box{max-width:900px;width:100%}
.lightbox .ph{min-height:min(64vh,520px)}
.lightbox .close{position:absolute;top:22px;right:24px;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}
.lightbox .close:hover{background:rgba(255,255,255,.2)}

/* Clients ------------------------------------------------------ */
.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.logo{
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;
  min-height:118px;border:1px dashed var(--line);border-radius:var(--radius);background:#fff;
  transition:.3s var(--ease);padding:20px;text-align:center;
}
.logo:hover{border-color:var(--teal);border-style:solid;transform:translateY(-4px);box-shadow:var(--shadow)}
.logo b{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.logo span{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}

/* FAQ ---------------------------------------------------------- */
.faq{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;box-shadow:var(--shadow-sm)}
.faq + .faq{margin-top:12px}
.faq button{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:18px;text-align:left;
  padding:22px 24px;background:none;border:0;cursor:pointer;font-size:17px;font-weight:700;color:var(--navy);
  letter-spacing:-.01em;
}
.faq button:hover{color:var(--blue)}
.faq .plus{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;transition:.3s var(--ease);color:var(--blue)}
.faq.open .plus{background:var(--blue);color:#fff;transform:rotate(45deg)}
.faq .ans{max-height:0;overflow:hidden;transition:max-height .38s var(--ease)}
.faq .ans p{padding:0 24px 24px;margin:0;color:var(--muted);font-size:16px;max-width:70ch}

/* Forms -------------------------------------------------------- */
.formcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:clamp(26px,3.4vw,40px);box-shadow:var(--shadow)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:13.5px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.field label .req{color:#D64545}
.field input,.field select,.field textarea{
  width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--white);
  font-family:inherit;font-size:15.5px;color:var(--ink);transition:.2s;
}
.field textarea{resize:vertical;min-height:118px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(18,97,160,.11)}
.field.err input,.field.err select,.field.err textarea{border-color:#D64545;box-shadow:0 0 0 4px rgba(214,69,69,.09)}
.field .msg{font-size:12.5px;color:#D64545;font-weight:600;display:none}
.field.err .msg{display:block}
.hp{position:absolute;left:-9999px;opacity:0;height:0}
.formnote{font-size:13.2px;color:var(--muted);margin-top:16px;line-height:1.6}

/* Contact rail ------------------------------------------------- */
.crow{display:flex;gap:16px;align-items:flex-start;padding:20px 0;border-bottom:1px solid var(--line-soft)}
.crow:last-child{border-bottom:0}
.crow .ico{margin-bottom:0;width:44px;height:44px;border-radius:12px}
.crow b{display:block;font-size:14px;color:var(--navy);font-weight:700;margin-bottom:2px}
.crow span{color:var(--muted);font-size:15.4px}
.pending{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#8A6D1F;background:#FDF6E3;border:1px solid #F0E2B8;padding:3px 11px;border-radius:99px}

/* Notice / disclaimer ------------------------------------------ */
.notice{
  display:flex;gap:14px;padding:20px 22px;border-radius:var(--radius);
  background:#F3F8FC;border:1px solid #DCE9F3;color:#3C5468;font-size:15px;line-height:1.65;
}
.notice svg{width:21px;height:21px;flex:none;color:var(--blue);margin-top:2px}
.notice b{color:var(--navy)}
.notice code{background:#E4EEF6;padding:1px 6px;border-radius:5px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* CTA band ----------------------------------------------------- */
.ctaband{position:relative;background:var(--navy);border-radius:var(--radius-lg);padding:clamp(38px,5vw,62px);overflow:hidden;text-align:center}
.ctaband::before{
  content:"";position:absolute;inset:0;

}
.ctaband>*{position:relative;z-index:2}
.ctaband h2{color:#fff;max-width:20ch;margin:0 auto .6em}
.ctaband p{color:#A9C1D4;max-width:54ch;margin:0 auto}
.ctaband .btnrow{justify-content:center}

/* Footer ------------------------------------------------------- */
.foot{background:var(--navy);color:#93AEC4;padding:clamp(54px,6vw,80px) 0 0;font-size:15px}
.foot h4{color:#fff;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px;font-weight:700}
.foot a{color:#93AEC4;transition:color .2s}
.foot a:hover{color:var(--teal)}
.footgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:40px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:11px;font-size:14.8px}
.foot .brand-name{color:#fff}
.foot .brand-sub{color:rgba(255,255,255,.55)}
.footabout{max-width:34ch;margin:20px 0 0;color:#8AA6BC;font-size:14.8px;line-height:1.7}
.social{display:flex;gap:10px;margin-top:22px}
.social a{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#93AEC4;transition:.25s}
.social a:hover{background:var(--teal);border-color:var(--teal);color:#04302e;transform:translateY(-3px)}
.footbar{margin-top:clamp(40px,5vw,60px);border-top:1px solid rgba(255,255,255,.1);padding:22px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13.6px;color:#7793AA}

/* Floating mobile actions -------------------------------------- */
.fab{display:none;position:fixed;left:0;right:0;bottom:0;z-index:180;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));grid-template-columns:repeat(3,1fr);gap:9px}
.fab a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:11px;font-size:11.5px;font-weight:700;color:var(--navy);letter-spacing:.02em}
.fab a svg{width:19px;height:19px}
.fab a.q{background:var(--blue);color:#fff}
.fab a.w{background:#E8F7EF;color:#1F7A4B}

/* Trust strip (assurance bar) ---------------------------------- */
.trust{background:var(--navy);border-top:1px solid rgba(255,255,255,.08);padding:20px 0}
.trust-in{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 38px}
.trust-item{display:inline-flex;align-items:center;gap:10px;color:#CFDCE8;font-size:14.6px;font-weight:600;letter-spacing:-.01em}
.trust-item svg{width:19px;height:19px;color:var(--accent);flex:none}

/* Stats band --------------------------------------------------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;text-align:center}
.stat b{display:block;font-size:clamp(38px,4.6vw,58px);font-weight:800;color:var(--navy);letter-spacing:-.035em;line-height:1.05}
.stat span{display:block;font-size:15.5px;color:var(--muted);margin-top:8px;font-weight:500}

/* 3-step cycle ------------------------------------------------- */
.cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;position:relative}
.cyc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:32px 28px;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease);position:relative}
.cyc:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.cyc .num{
  position:absolute;top:-16px;left:28px;width:38px;height:38px;border-radius:11px;

.cyc h3{margin:14px 0 10px}
.cyc p{color:var(--muted);font-size:15.6px;margin:0}

/* Verification flag on claims ---------------------------------- */
.claimnote{font-size:12.6px;color:var(--muted);text-align:center;margin-top:22px;line-height:1.6}

@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr);gap:34px 20px}
  .cycle{grid-template-columns:1fr;gap:30px}
}
@media (max-width:640px){
  .trust-in{gap:12px 22px}
  .trust-item{font-size:13.4px}
}

/* Reveal animation --------------------------------------------- */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}

/* Responsive --------------------------------------------------- */
@media (max-width:1080px){
  .navlinks{display:none}

  .nav-cta .btn{display:none}
  .g4{grid-template-columns:repeat(2,1fr)}
  .footgrid{grid-template-columns:1fr 1fr;gap:34px}
  .masonry{columns:2}
}
@media (max-width:860px){
  .g3{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  .checks--2{grid-template-columns:1fr}
  .logos{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .wrap{padding:0 18px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .masonry{columns:1}
  .logos{grid-template-columns:1fr}
  .fab{display:grid}
  body{padding-bottom:70px}
  .hero{min-height:auto;padding:calc(var(--nav-h) + 54px) 0 90px}
  .hero-scroll,.hero-stage{display:none}
  #scene{display:none}
  .hero-fallback{display:block}
  .footbar{flex-direction:column;gap:8px}
  .step{grid-template-columns:46px 1fr;gap:15px}
  .step .dot{width:46px;height:46px;border-radius:13px;font-size:13px}
  .flow::before,.flow-fill{left:22px}
  .btn{width:100%}
  .btnrow .btn{width:auto;flex:1 1 auto;min-width:160px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  .rv{opacity:1;transform:none}
}

  // active nav: map service detail pages onto /services
  let active = path;
  if (path.startsWith('/services/')) active = '/services';

/* Reveal on scroll */
let revealObs;
function initReveal(){
  if (revealObs) revealObs.disconnect();
  revealObs = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); revealObs.unobserve(en.target); } });
  }, {threshold:.12, rootMargin:'0px 0px -40px'});
  document.querySelectorAll('.rv').forEach((el,i) => {
    el.style.transitionDelay = (i % 4) * 60 + 'ms';
    revealObs.observe(el);
  });
}

/* Process timeline progressive fill */
let flowObs;
function initFlow(){
  if (flowObs) flowObs.disconnect();
  const flows = document.querySelectorAll('.flow');
  if (!flows.length) return;
  flowObs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) en.target.classList.add('on');
    });
    flows.forEach(flow => {
      const steps = [...flow.querySelectorAll('.step')];
      const done = steps.filter(s => s.classList.contains('on'));
      const fill = flow.querySelector('.flow-fill');
      if (fill && done.length){
        const last = done[done.length-1];
        fill.style.height = (last.offsetTop + last.offsetHeight/2 - 14) + 'px';
      }
    });
  }, {threshold:.5, rootMargin:'0px 0px -20%'});
  document.querySelectorAll('.step').forEach(s => flowObs.observe(s));
}

    el.addEventListener('input', () => el.closest('.field')?.classList.remove('err'));
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (form.website.value) return;              // honeypot tripped — drop silently
    if (!validate()) return;

    const btn = form.querySelector('button[type="submit"]');
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = 'Sending…';

    const data = Object.fromEntries(new FormData(form).entries());
    delete data.website;

    const payload = {
      ...data,
      source: 'Website — Request a Quote',
      page: currentPath(),
      status: LEAD_STATUSES[0],
      submittedAt: new Date().toISOString()
    };

    try {
      await submitEnquiry(payload);
      go('/thank-you');
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = original;
      let note = form.querySelector('.submit-error');
      if (!note){
        note = document.createElement('p');
        note.className = 'submit-error';
        note.style.cssText = 'color:#D64545;font-weight:600;font-size:14px;margin-top:14px';
        form.appendChild(note);
      }
      note.textContent = 'We could not send that. Check your connection and try again, or email us directly.';
    }
  });
}

/* ================================================================
   HERO 3D — industrial laundry line (Three.js r128)
   Desktop only. Mobile falls back to the CSS gradient composition.
   ================================================================ */
let SCENE = null;
const STAGES = ['Collection','Sorting','Washing','Rinsing','Drying','Finishing','Packaging','Lockup'];

function destroyScene(){
  if (!SCENE) return;
  cancelAnimationFrame(SCENE.raf);
  window.removeEventListener('resize', SCENE.onResize);
  window.removeEventListener('mousemove', SCENE.onMove);
  window.removeEventListener('scroll', SCENE.onScroll);
  SCENE.renderer.dispose();
  SCENE.scene.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) Array.isArray(o.material) ? o.material.forEach(m=>m.dispose()) : o.material.dispose();
  });
  SCENE = null;
}

function initScene(){
  const canvas = document.getElementById('scene');
  if (!canvas || typeof THREE === 'undefined') return;
  if (window.innerWidth < 641) return;                       // mobile → CSS fallback
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0B1F33, 24, 62);

  const camera = new THREE.PerspectiveCamera(42, canvas.clientWidth / canvas.clientHeight, 0.1, 200);
  camera.position.set(2, 4.2, 15);

  /* --- Materials ------------------------------------------------ */
  const steel   = new THREE.MeshStandardMaterial({color:0xC3D2DD, metalness:.92, roughness:.28});
  const steelDk = new THREE.MeshStandardMaterial({color:0x7C93A6, metalness:.85, roughness:.42});
  const navyMat = new THREE.MeshStandardMaterial({color:0x11314f, metalness:.35, roughness:.72});
  const tealMat = new THREE.MeshStandardMaterial({color:0x16A6A0, emissive:0x0d6b67, emissiveIntensity:.85, roughness:.4, metalness:.2});
  const glass   = new THREE.MeshStandardMaterial({color:0x0d2b46, metalness:.55, roughness:.12, transparent:true, opacity:.62});

  /* --- Floor ---------------------------------------------------- */
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 60), new THREE.MeshStandardMaterial({color:0x0a1a2b, roughness:.62, metalness:.32}));
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -1.6;
  scene.add(floor);

  // floor guide lines — the direction of flow, always one way
  for (let i = -2; i <= 2; i++){
    const line = new THREE.Mesh(new THREE.BoxGeometry(70, .02, .05), new THREE.MeshStandardMaterial({color:0x1c4a6e, roughness:.9}));
    line.position.set(0, -1.58, i * 4.2);
    scene.add(line);
  }

  /* --- Conveyor ------------------------------------------------- */
  const belt = new THREE.Mesh(new THREE.BoxGeometry(64, .34, 2.5), steelDk);
  belt.position.y = -.2;
  scene.add(belt);
  const beltTop = new THREE.Mesh(new THREE.BoxGeometry(64, .06, 2.2), navyMat);
  beltTop.position.y = 0;
  scene.add(beltTop);

  // conveyor legs
  for (let x = -30; x <= 30; x += 5){
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.16, 1.4, .16), steelDk);
    leg.position.set(x, -1, .9);
    scene.add(leg);
    const leg2 = leg.clone(); leg2.position.z = -.9; scene.add(leg2);
  }

  /* --- Stations (washer drums) ---------------------------------- */
  const drums = [];
  const stationX = [-15, -5, 5, 15];
  stationX.forEach((x, idx) => {
    const g = new THREE.Group();

    const body = new THREE.Mesh(new THREE.BoxGeometry(4.4, 4.4, 3.6), steel);
    body.position.y = 1.4;
    g.add(body);

    const panel = new THREE.Mesh(new THREE.BoxGeometry(4.5, .5, .12), navyMat);
    panel.position.set(0, 3.3, 1.84);
    g.add(panel);

    const ledStrip = new THREE.Mesh(new THREE.BoxGeometry(3.2, .1, .06), tealMat);
    ledStrip.position.set(0, 3.3, 1.92);
    g.add(ledStrip);

    // porthole
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.28, .17, 12, 40), steelDk);
    ring.position.set(0, 1.4, 1.82);
    g.add(ring);
    const win = new THREE.Mesh(new THREE.CircleGeometry(1.2, 40), glass);
    win.position.set(0, 1.4, 1.83);
    g.add(win);

    // rotating inner drum, visible through the glass
    const inner = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, .5, 26, 1, true),
      new THREE.MeshStandardMaterial({color:0x2f7fae, metalness:.7, roughness:.35, side:THREE.DoubleSide}));
    inner.rotation.x = Math.PI/2;
    inner.position.set(0, 1.4, 1.5);
    g.add(inner);

    // vent pipe up to the ceiling run
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(.2, .2, 3.4, 12), steelDk);
    pipe.position.set(1.4, 5.2, 0);
    g.add(pipe);

    g.position.x = x;
    scene.add(g);
    drums.push({inner, led: ledStrip, phase: idx});
  });

  // overhead service run
  for (let i = 0; i < 3; i++){
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.14, .14, 68, 10), steelDk);
    p.rotation.z = Math.PI/2;
    p.position.set(0, 6.9 + i*.42, -1.2 + i*.5);
    scene.add(p);
  }

  /* --- Garment bundles moving down the line --------------------- */
  const SOILED = new THREE.Color(0x6f6552);
  const CLEAN  = new THREE.Color(0xEAF3F8);
  const bundles = [];
  for (let i = 0; i < 22; i++){
    const m = new THREE.MeshStandardMaterial({color:SOILED.clone(), roughness:.86, metalness:.04});
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.15, .58, 1.5), m);
    b.position.set(-32 + i * 2.9, .38, (i % 2 ? .32 : -.32));
    b.rotation.y = (i % 3) * .06;
    scene.add(b);
    bundles.push(b);
  }

  /* --- Lockup racking at the clean end -------------------------- */
  const rack = new THREE.Group();
  for (let s = 0; s < 3; s++){
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(9, .14, 2), steelDk);
    shelf.position.set(0, s * 1.5, 0);
    rack.add(shelf);
    for (let k = 0; k < 6; k++){
      const pack = new THREE.Mesh(new THREE.BoxGeometry(1.2, .8, 1.5),
        new THREE.MeshStandardMaterial({color:0xDCE9F1, roughness:.8, metalness:.03}));
      pack.position.set(-3.6 + k * 1.45, s * 1.5 + .47, 0);
      rack.add(pack);
    }
  }
  rack.position.set(25, .2, -6.5);
  rack.rotation.y = -.34;
  scene.add(rack);

  /* --- Lighting ------------------------------------------------- */
  scene.add(new THREE.AmbientLight(0x5f7f9c, .55));
  const key = new THREE.DirectionalLight(0xE8F4FF, 1.15);
  key.position.set(-8, 14, 12);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x1261A0, .95);
  rim.position.set(14, 6, -12);
  scene.add(rim);
  const tealGlow = new THREE.PointLight(0x16A6A0, 1.5, 34);
  tealGlow.position.set(4, 3.4, 5);
  scene.add(tealGlow);
  const blueGlow = new THREE.PointLight(0x1261A0, 1.2, 40);
  blueGlow.position.set(-14, 4, 6);
  scene.add(blueGlow);

  /* --- Interaction ---------------------------------------------- */
  let mx = 0, my = 0, tmx = 0, tmy = 0, scrollP = 0, tScroll = 0;
  const onMove = e => {
    tmx = (e.clientX / window.innerWidth - .5) * 2;
    tmy = (e.clientY / window.innerHeight - .5) * 2;
  };
  const onScroll = () => {
    const h = document.querySelector('.hero');
    if (!h) return;
    tScroll = Math.min(1, Math.max(0, window.scrollY / (h.offsetHeight * 1.15)));
    const label = document.getElementById('stageName');
    if (label){
      const s = STAGES[Math.min(STAGES.length-1, Math.floor(tScroll * STAGES.length))];
      if (label.textContent !== s) label.textContent = s;
    }
  };
  const onResize = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  };
  window.addEventListener('mousemove', onMove, {passive:true});
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onResize);

  /* --- Loop ----------------------------------------------------- */
  const clock = new THREE.Clock();
  const tmp = new THREE.Color();

  function frame(){
    SCENE.raf = requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), .05);
    const t = clock.getElapsedTime();

    if (!reduced){
      // bundles travel left → right, turning clean as they clear the wash stations
      bundles.forEach(b => {
        b.position.x += dt * 3.2;
        if (b.position.x > 32) b.position.x = -32;
        const p = Math.min(1, Math.max(0, (b.position.x + 4) / 16));   // clean-up ramp
        tmp.copy(SOILED).lerp(CLEAN, p);
        b.material.color.copy(tmp);
        b.position.y = .38 + Math.sin(t * 2.4 + b.position.x * .4) * .025;
      });
      drums.forEach((d, i) => {
        d.inner.rotation.y += dt * (2.2 + i * .35);
        d.led.material.emissiveIntensity = .55 + Math.sin(t * 1.8 + i) * .3;
      });
      tealGlow.intensity = 1.35 + Math.sin(t * 1.5) * .25;
    }

    // easing toward cursor + scroll targets
    mx += (tmx - mx) * .045;
    my += (tmy - my) * .045;
    scrollP += (tScroll - scrollP) * .06;

    camera.position.x = -6 + scrollP * 14 + mx * 2.2;
    camera.position.y = 4.2 - scrollP * 1.1 - my * .9;
    camera.position.z = 15 - scrollP * 3.2;
    camera.lookAt(camera.position.x * .35 + 2, 1.5 - my * .4, -1);

    renderer.render(scene, camera);
  }

  SCENE = {renderer, scene, camera, onResize, onMove, onScroll, raf:0};
  onResize();
  onScroll();
  frame();
}

   BOOT

renderFooter();
route();
</script>
